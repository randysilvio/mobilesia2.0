name: Build APK Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Alamat SIAKAD: atur di Settings › Secrets and variables › Actions › Variables › API_URL
      API_URL: ${{ vars.API_URL || 'https://sttgpi.ac.id' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: |
          npm install --no-audit --no-fund 2>&1 | tee -a build.log
          npx expo install --fix 2>&1 | tee -a build.log

      - name: Periksa TypeScript
        run: npx tsc --noEmit 2>&1 | tee -a build.log

      - name: Periksa konfigurasi Expo
        run: npx expo-doctor 2>&1 | tee -a build.log || echo "expo-doctor memberi peringatan (tidak menghentikan build)"

      - name: Prebuild proyek Android
        run: npx expo prebuild --platform android --no-install --clean 2>&1 | tee -a build.log

      - name: Atur tanda tangan rilis
        run: python3 scripts/atur-signing.py 2>&1 | tee -a build.log

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore rilis dipakai."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum diisi — APK ditandatangani kunci DEBUG (hanya untuk uji coba)."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK rilis
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee -a ../build.log

      - name: Kumpulkan APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sttgpi-siakad.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs sttgpi-siakad.apk | tee -a build.log
          ls -la sttgpi-siakad.apk

      - name: Terbitkan rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: SIAKAD STT GPI Papua ${{ env.VERSION_NAME }}
          files: sttgpi-siakad.apk
          make_latest: true
          body: |
            APK Android build ${{ env.VERSION_CODE }} dari commit ${{ github.sha }}.
            Server bawaan: ${{ env.API_URL }}
            Unduh `sttgpi-siakad.apk` lalu pasang di HP Android.

      - name: Ringkas galat build
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -nE "error|Error|ERROR|FAILURE|What went wrong|ETARGET|ERESOLVE|TS[0-9]{4}" build.log | tail -40 > galat.txt || true
            tail -60 build.log >> galat.txt
            RINGKAS=$(sed -e 's/%/%25/g' galat.txt | sed -e ':a;N;$!ba;s/\n/%0A/g' | cut -c1-60000)
            echo "::error title=Build APK gagal::${RINGKAS}"
          fi
